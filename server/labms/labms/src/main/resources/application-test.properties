# Application Configuration
spring.application.name=labms
server.port=${SERVER_PORT:8080}

# MySQL Test Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lab_management_test?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=WARN
logging.level.com.as.labms=INFO
logging.level.org.hibernate.SQL=WARN

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always